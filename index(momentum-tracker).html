<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum | Task Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/1a1a2e/ffffff?text=M">

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        /* Custom Styles & Animations */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Disable tap highlight on mobile */
        }

        .task-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top;
        }
        
        .task-card.completed {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            text-decoration-color: rgba(129, 140, 248, 0.6);
        }
        
        .subtask.completed .subtask-title {
            text-decoration: line-through;
            text-decoration-color: rgba(167, 139, 250, 0.7);
        }

        .progress-bar-inner {
            transition: width 0.5s ease-in-out;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-backdrop {
            transition: opacity 0.3s ease-in-out;
        }
        .modal-content {
            transition: all 0.3s ease-in-out;
            transform: translateY(20px);
        }
        .modal-container.visible .modal-backdrop {
            opacity: 1;
        }
        .modal-container.visible .modal-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e3f;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }
    </style>
</head>
<body class="bg-[#10101a] text-gray-200 antialiased">

    <div id="app" class="min-h-screen max-w-lg mx-auto flex flex-col p-4 md:p-6 relative">
        
        <!-- Header -->
        <header class="fade-in mb-4">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 id="current-date" class="font-bold text-2xl tracking-tight text-white"></h1>
                    <p id="greeting" class="text-indigo-300 font-medium"></p>
                </div>
                <div class="text-right">
                    <p class="font-semibold text-lg text-white">Momentum</p>
                    <p id="motivational-quote" class="text-xs text-gray-400 italic mt-1"></p>
                </div>
            </div>
             <button id="clear-all-btn" class="w-full text-sm bg-red-800/20 text-red-300 hover:bg-red-800/50 rounded-lg px-4 py-2 transition-all duration-300 flex items-center justify-center space-x-2">
                <i data-feather="trash-2" class="w-4 h-4"></i>
                <span>Clear All Tasks</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-grow pb-20">
            <!-- Progress Bar -->
            <div class="mb-4 fade-in" style="animation-delay: 100ms;">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm font-medium text-gray-300">Total Progress</span>
                    <span id="progress-text" class="text-sm font-medium text-indigo-300">0%</span>
                </div>
                <div class="w-full bg-[#1e1e3f] rounded-full h-2.5">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full progress-bar-inner" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- Filters -->
            <div id="filter-container" class="mb-4 flex flex-wrap gap-2 fade-in" style="animation-delay: 200ms;">
                <!-- Filter buttons will be injected here -->
            </div>
            
            <!-- Tasks List -->
            <div id="task-list" class="space-y-3">
                <!-- Tasks will be injected here by JavaScript -->
            </div>
        </main>

        <!-- Add Task FAB -->
        <button id="add-task-fab" class="fixed bottom-6 right-6 bg-gradient-to-br from-indigo-500 to-purple-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg transform transition-transform hover:scale-110">
            <i data-feather="plus" class="w-7 h-7"></i>
        </button>

        <!-- Modals -->

        <!-- Add Task Modal -->
        <div id="add-task-modal" class="modal-container fixed inset-0 z-50 flex items-center justify-center p-4 invisible">
            <div class="modal-backdrop fixed inset-0 bg-black/70 opacity-0"></div>
            <div class="modal-content bg-[#1e1e3f] rounded-2xl shadow-xl w-full max-w-sm p-6 opacity-0">
                <h2 class="text-xl font-bold text-white mb-4">Add New Task</h2>
                <form id="add-task-form">
                    <div class="mb-4">
                        <label for="task-title" class="block text-sm font-medium text-indigo-300 mb-1">Title</label>
                        <input type="text" id="task-title" name="title" class="w-full bg-[#10101a] text-white border-2 border-gray-700 rounded-lg px-3 py-2 focus:border-indigo-500 focus:outline-none transition-colors" required>
                    </div>
                    <div class="mb-6">
                        <label for="task-category" class="block text-sm font-medium text-indigo-300 mb-1">Category</label>
                        <input type="text" id="task-category" name="category" class="w-full bg-[#10101a] text-white border-2 border-gray-700 rounded-lg px-3 py-2 focus:border-indigo-500 focus:outline-none transition-colors" placeholder="e.g., Web Dev, Math">
                    </div>
                    <div class="flex justify-end gap-3">
                        <button type="button" class="modal-close-btn px-4 py-2 rounded-lg bg-gray-700/50 text-gray-300 hover:bg-gray-700 transition-colors">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-500 transition-colors">Add Task</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Clear All Confirmation Modal -->
        <div id="clear-all-modal" class="modal-container fixed inset-0 z-50 flex items-center justify-center p-4 invisible">
            <div class="modal-backdrop fixed inset-0 bg-black/70 opacity-0"></div>
            <div class="modal-content bg-[#1e1e3f] rounded-2xl shadow-xl w-full max-w-sm p-6 opacity-0">
                <h2 class="text-xl font-bold text-red-400 mb-2">Are you sure?</h2>
                <p class="text-gray-300 mb-6">This will permanently delete all tasks. This action cannot be undone.</p>
                <div class="flex justify-end gap-3">
                    <button type="button" class="modal-close-btn px-4 py-2 rounded-lg bg-gray-700/50 text-gray-300 hover:bg-gray-700 transition-colors">Cancel</button>
                    <button id="confirm-clear-btn" type="button" class="px-4 py-2 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-500 transition-colors">Clear All</button>
                </div>
            </div>
        </div>

    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker registration successful with scope: ', registration.scope))
                    .catch(error => console.log('ServiceWorker registration failed: ', error));
            });
        }
    </script>
    
    <!-- Inline Manifest for simplicity, normally in manifest.json -->
    <script type="application/json" id="manifest">
    {
      "name": "Momentum: Task Tracker",
      "short_name": "Momentum",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#10101a",
      "theme_color": "#1a1a2e",
      "description": "A sleek and modern PWA to track your tasks and build momentum.",
      "icons": [
        {
          "src": "https://placehold.co/192x192/1a1a2e/ffffff?text=M",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://placehold.co/512x512/1a1a2e/ffffff?text=M",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    }
    </script>
    
    <!-- Main Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = {
                // --- DATA ---
                quotes: [
                    "The secret of getting ahead is getting started.",
                    "Discipline is the bridge between goals and accomplishment.",
                    "Well done is better than well said.",
                    "A year from now you may wish you had started today.",
                    "The future depends on what you do today."
                ],

                state: {
                    tasks: [],
                    currentFilter: 'all'
                },

                // --- INITIAL TASKS ---
                initialTasks: [
                    {
                        id: crypto.randomUUID(),
                        category: 'Math (Riley)',
                        title: 'Hyperbolic functions',
                        completed: false,
                        subtasks: []
                    },
                    {
                        id: crypto.randomUUID(),
                        category: 'Math (Riley)',
                        title: 'Complex numbers',
                        completed: false,
                        subtasks: []
                    },
                    {
                        id: crypto.randomUUID(),
                        category: 'Math (Riley)',
                        title: 'Theory of equations part',
                        completed: false,
                        subtasks: []
                    },
                    {
                        id: crypto.randomUUID(),
                        category: 'Growth',
                        title: 'Collect 30 profiles',
                        completed: false,
                        subtasks: []
                    },
                    {
                        id: crypto.randomUUID(),
                        category: 'Growth',
                        title: 'Remove 200 insta',
                        completed: false,
                        subtasks: []
                    },
                    {
                        id: crypto.randomUUID(),
                        category: 'Web Dev',
                        title: 'Production Env',
                        completed: false,
                        subtasks: [
                            { id: crypto.randomUUID(), title: 'Polish landing page', completed: false },
                            { id: crypto.randomUUID(), title: 'Clean up cloudinary', completed: false },
                            { id: crypto.randomUUID(), title: 'Add delete function', completed: false },
                            { id: crypto.randomUUID(), title: 'Account for country code problem', completed: false },
                            { id: crypto.randomUUID(), title: 'Sort out layout issue on store page', completed: false }
                        ]
                    },
                    {
                        id: crypto.randomUUID(),
                        category: 'Web Dev',
                        title: 'Dev Env',
                        completed: false,
                        subtasks: [
                            { id: crypto.randomUUID(), title: 'Mpesa', completed: false },
                            { id: crypto.randomUUID(), title: 'Stripe', completed: false },
                            { id: crypto.randomUUID(), title: 'Auth', completed: false }
                        ]
                    }
                ],

                // --- DOM ELEMENTS ---
                elements: {
                    taskList: document.getElementById('task-list'),
                    currentDate: document.getElementById('current-date'),
                    greeting: document.getElementById('greeting'),
                    motivationalQuote: document.getElementById('motivational-quote'),
                    progressBar: document.getElementById('progress-bar'),
                    progressText: document.getElementById('progress-text'),
                    filterContainer: document.getElementById('filter-container'),
                    addTaskFab: document.getElementById('add-task-fab'),
                    addTaskModal: document.getElementById('add-task-modal'),
                    addTaskForm: document.getElementById('add-task-form'),
                    clearAllBtn: document.getElementById('clear-all-btn'),
                    clearAllModal: document.getElementById('clear-all-modal'),
                    confirmClearBtn: document.getElementById('confirm-clear-btn'),
                },
                
                // --- METHODS ---
                init() {
                    this.loadState();
                    this.updateHeader();
                    this.renderFilters();
                    this.renderTasks();
                    this.addEventListeners();
                    feather.replace(); // Initialize Feather icons
                },
                
                loadState() {
                    const savedTasks = localStorage.getItem('momentumTasks');
                    if (savedTasks) {
                        this.state.tasks = JSON.parse(savedTasks);
                    } else {
                        // Load initial tasks if no saved data
                        this.state.tasks = this.initialTasks;
                    }
                },

                saveState() {
                    localStorage.setItem('momentumTasks', JSON.stringify(this.state.tasks));
                },

                updateHeader() {
                    const now = new Date();
                    this.elements.currentDate.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                    
                    const hour = now.getHours();
                    let greetingText = 'Good Evening';
                    if (hour < 12) greetingText = 'Good Morning';
                    else if (hour < 18) greetingText = 'Good Afternoon';
                    this.elements.greeting.textContent = greetingText;

                    const randomQuote = this.quotes[Math.floor(Math.random() * this.quotes.length)];
                    this.elements.motivationalQuote.textContent = `"${randomQuote}"`;
                },

                renderFilters() {
                    const categories = ['all', ...new Set(this.state.tasks.map(task => task.category || 'Uncategorized'))];
                    this.elements.filterContainer.innerHTML = categories.map(category => {
                        const isActive = this.state.currentFilter === category;
                        return `
                            <button 
                                data-filter="${category}" 
                                class="filter-btn capitalize px-3 py-1 rounded-full text-sm font-medium transition-all duration-300
                                ${isActive 
                                    ? 'bg-indigo-600 text-white' 
                                    : 'bg-[#1e1e3f] text-gray-300 hover:bg-indigo-500/20'
                                }"
                            >
                                ${category}
                            </button>
                        `;
                    }).join('');
                },

                renderTasks() {
                    this.elements.taskList.innerHTML = '';
                    
                    const filteredTasks = this.state.tasks.filter(task => 
                        this.state.currentFilter === 'all' || 
                        (task.category || 'Uncategorized') === this.state.currentFilter
                    );

                    if (filteredTasks.length === 0) {
                        this.elements.taskList.innerHTML = `<p class="text-center text-gray-400">No tasks found. Add one!</p>`;
                        this.updateProgress(filteredTasks);
                        return;
                    }

                    filteredTasks.forEach((task, index) => {
                        const taskElement = document.createElement('div');
                        taskElement.className = `task-card p-4 rounded-2xl bg-[#1e1e3f] shadow-md fade-in ${task.completed ? 'completed' : ''}`;
                        taskElement.style.animationDelay = `${index * 50}ms`;
                        
                        taskElement.innerHTML = this.getTaskHtml(task);
                        this.elements.taskList.appendChild(taskElement);
                    });
                    
                    this.addTaskEventListeners();
                    this.updateProgress(filteredTasks);
                    feather.replace(); // Re-apply icons
                },
                
                getTaskHtml(task) {
                    const categoryHtml = task.category 
                        ? `<p class="font-semibold text-indigo-300 text-xs uppercase tracking-wider">${task.category}</p>` 
                        : '';
                    
                    const subtasksHtml = task.subtasks.length > 0 
                        ? `<div class="mt-3 space-y-2 pl-4 border-l-2 border-gray-700">
                                ${task.subtasks.map(subtask => `
                                    <div data-task-id="${task.id}" data-subtask-id="${subtask.id}" class="subtask flex items-center justify-between cursor-pointer group ${subtask.completed ? 'completed' : ''}">
                                        <div class="flex items-center">
                                            <div class="subtask-checkbox w-4 h-4 rounded border-2 ${subtask.completed ? 'bg-purple-500 border-purple-500' : 'border-gray-600'} flex-shrink-0 mr-2 transition-all">
                                                ${subtask.completed ? '<i data-feather="check" class="w-3 h-3 text-white"></i>' : ''}
                                            </div>
                                            <span class="subtask-title text-sm text-gray-300">${subtask.title}</span>
                                        </div>
                                    </div>
                                `).join('')}
                           </div>`
                        : '';

                    return `
                        <div class="flex items-start justify-between">
                            <div class="flex-grow flex items-start cursor-pointer" data-task-id="${task.id}">
                                <div class="task-checkbox w-6 h-6 rounded-full flex items-center justify-center border-2 ${task.completed ? 'bg-indigo-500 border-indigo-500' : 'border-gray-600'} transition-all duration-300 flex-shrink-0 mr-4 mt-1">
                                    ${task.completed ? '<i data-feather="check" class="w-4 h-4 text-white"></i>' : ''}
                                </div>
                                <div class="flex-grow">
                                    ${categoryHtml}
                                    <p class="task-title text-white font-medium text-lg">${task.title}</p>
                                </div>
                            </div>
                            <button class="delete-task-btn ml-4 text-gray-600 hover:text-red-400 transition-colors" data-task-id="${task.id}">
                                <i data-feather="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                        ${subtasksHtml}
                    `;
                },
                
                addTaskEventListeners() {
                    this.elements.taskList.querySelectorAll('.task-checkbox, .task-title').forEach(el => {
                        el.closest('[data-task-id]').addEventListener('click', (e) => {
                             // Prevent clicks on subtasks from bubbling up to toggle the main task
                            if (e.target.closest('.subtask')) return;
                            
                            const taskId = e.currentTarget.dataset.taskId;
                            this.toggleTaskCompletion(taskId);
                        });
                    });

                    this.elements.taskList.querySelectorAll('.subtask').forEach(el => {
                        el.addEventListener('click', (e) => {
                            const taskId = e.currentTarget.dataset.taskId;
                            const subtaskId = e.currentTarget.dataset.subtaskId;
                            this.toggleSubtaskCompletion(taskId, subtaskId);
                        });
                    });

                    this.elements.taskList.querySelectorAll('.delete-task-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const taskId = e.currentTarget.dataset.taskId;
                            this.deleteTask(taskId);
                        });
                    });
                },

                toggleTaskCompletion(taskId) {
                    const task = this.state.tasks.find(t => t.id === taskId);
                    if (!task) return;
                    
                    task.completed = !task.completed;
                    
                    // Optional: Toggle all subtasks when parent is toggled
                    // task.subtasks.forEach(sub => sub.completed = task.completed);
                    
                    this.saveState();
                    this.renderTasks(); // Re-render to update UI
                },
                
                toggleSubtaskCompletion(taskId, subtaskId) {
                    const task = this.state.tasks.find(t => t.id === taskId);
                    if (!task) return;
                    
                    const subtask = task.subtasks.find(s => s.id === subtaskId);
                    if (!subtask) return;
                    
                    subtask.completed = !subtask.completed;
                    
                    // Optional: Check if all subtasks are complete to mark parent complete
                    // task.completed = task.subtasks.every(s => s.completed);

                    this.saveState();
                    this.renderTasks();
                },
                
                deleteTask(taskId) {
                    this.state.tasks = this.state.tasks.filter(t => t.id !== taskId);
                    this.saveState();
                    this.renderFilters(); // Re-render filters in case a category is now empty
                    this.renderTasks();
                },

                updateProgress(tasks) {
                    const taskList = tasks || this.state.tasks; // Use provided list (filtered) or all tasks
                    const completedTasks = taskList.filter(task => task.completed).length;
                    const totalTasks = taskList.length;
                    const percentage = totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0;
                    
                    this.elements.progressBar.style.width = `${percentage}%`;
                    this.elements.progressText.textContent = `${Math.round(percentage)}% Complete`;
                },
                
                showModal(modal) {
                    modal.classList.remove('invisible');
                    modal.classList.add('visible');
                },

                hideModal(modal) {
                    modal.classList.remove('visible');
                    modal.classList.add('invisible');
                },

                handleAddTaskForm(e) {
                    e.preventDefault();
                    const title = e.target.title.value.trim();
                    const category = e.target.category.value.trim() || 'Uncategorized';
                    
                    if (title) {
                        const newTask = {
                            id: crypto.randomUUID(),
                            category: category,
                            title: title,
                            completed: false,
                            subtasks: []
                        };
                        this.state.tasks.unshift(newTask); // Add to the beginning
                        this.saveState();
                        this.renderFilters(); // Update filters with new category if needed
                        
                        // If current filter is not 'all', switch to new task's category
                        if(this.state.currentFilter !== 'all' && this.state.currentFilter !== category) {
                           this.state.currentFilter = category;
                           this.renderFilters();
                        }
                        
                        this.renderTasks();
                        this.hideModal(this.elements.addTaskModal);
                        e.target.reset();
                    }
                },
                
                clearAllTasks() {
                    this.state.tasks = [];
                    this.saveState();
                    this.renderFilters();
                    this.renderTasks();
                    this.hideModal(this.elements.clearAllModal);
                },

                addEventListeners() {
                    // Filter buttons
                    this.elements.filterContainer.addEventListener('click', (e) => {
                        const target = e.target.closest('.filter-btn');
                        if (target) {
                            this.state.currentFilter = target.dataset.filter;
                            this.renderFilters(); // Re-render filters to show active state
                            this.renderTasks();
                        }
                    });

                    // Add Task FAB
                    this.elements.addTaskFab.addEventListener('click', () => {
                        this.showModal(this.elements.addTaskModal);
                        this.elements.addTaskModal.querySelector('input[name="title"]').focus();
                    });
                    
                    // Add Task Modal
                    this.elements.addTaskForm.addEventListener('submit', (e) => this.handleAddTaskForm(e));
                    this.elements.addTaskModal.querySelectorAll('.modal-close-btn, .modal-backdrop').forEach(el => {
                        el.addEventListener('click', () => this.hideModal(this.elements.addTaskModal));
                    });
                    
                    // Clear All Button
                    this.elements.clearAllBtn.addEventListener('click', () => {
                        this.showModal(this.elements.clearAllModal);
                    });
                    
                    // Clear All Modal
                    this.elements.confirmClearBtn.addEventListener('click', () => this.clearAllTasks());
                    this.elements.clearAllModal.querySelectorAll('.modal-close-btn, .modal-backdrop').forEach(el => {
                        el.addEventListener('click', () => this.hideModal(this.elements.clearAllModal));
                    });
                }
            };

            app.init();
        });
    </script>
</body>
</html>
